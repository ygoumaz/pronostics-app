# fly.toml — Pronostics Coupe du Monde 2026
app = "pronostics-app"
primary_region = "cdg"  # Paris — change if you prefer another region

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # DATABASE_URL is set via fly secrets (points to /data/prod.db)
  DATABASE_URL = "file:/data/prod.db"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "pronostics_data"
  destination = "/data"
  initial_size = "1gb"
