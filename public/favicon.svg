<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Football favicon">
  <!-- Background square -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#061A2D"/>

  <!-- Ball main element -->
  <g transform="translate(32 32)">
    <!-- Soft shadow -->
    <ellipse cx="0" cy="18" rx="15" ry="4" fill="#000000" opacity="0.22"/>

    <!-- Outer ball -->
    <circle r="19" fill="#F8FAFC"/>
    <circle r="19" fill="none" stroke="#D8E2EA" stroke-width="1.5"/>

    <!-- Red left panel, moved more to the left -->
    <path
      d="M-18 -5C-15 -15 -8 -19 1 -18C-5 -12 -8 -5 -7 4C-12 2 -16 -1 -18 -5Z"
      fill="#D43C3C"
    />

    <!-- Blue right panel, moved more to the right -->
    <path
      d="M8 -18C16 -14 19 -7 18 1C13 -2 9 -1 5 5C4 -4 5 -11 8 -18Z"
      fill="#1F8EEA"
    />

    <!-- Green lower panel -->
    <path
      d="M-9 12C-2 9 7 9 15 12C10 18 0 21 -10 16C-13 15 -12 13 -9 12Z"
      fill="#35A853"
    />

    <!-- Navy curved separators, adjusted to keep clearer spacing -->
    <path
      d="M-14 -14C-8 -10 -6 -4 -7 4"
      fill="none"
      stroke="#14233B"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M8 -17C7 -9 5 -2 1 6"
      fill="none"
      stroke="#14233B"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M-10 13C-2 9 7 9 15 12"
      fill="none"
      stroke="#14233B"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Central badge area, simplified and original -->
    <rect x="-5.8" y="-8.2" width="11.6" height="15.8" rx="2.6" fill="#EAF7FF"/>
    <rect x="-4" y="-6.2" width="8" height="11.8" rx="1.7" fill="#1F8EEA"/>

    <!-- Simple trophy-like icon, not official logo -->
    <path
      d="M0 -4.2C1.9 -4.2 3.2 -3 3.2 -1.3C3.2 0.4 2.1 1.6 0.9 1.9V3.7H2.6V4.8H-2.6V3.7H-0.9V1.9C-2.1 1.6 -3.2 0.4 -3.2 -1.3C-3.2 -3 -1.9 -4.2 0 -4.2Z"
      fill="#FFFFFF"
    />

    <!-- Small highlight -->
    <path
      d="M-10 -13C-6 -16 -1 -17 4 -16"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.45"
    />
  </g>
</svg>